name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # tests -> snippets -> Asciidoctor (fails on missing snippets) -> jar -> coverage + integration tests
      - name: Build, test and generate API docs
        run: mvn -B clean verify

      - name: Upload API docs
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: target/generated-docs

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/generated-docs

      - name: Build Docker image
        run: docker build -t telecom-docs-service:${{ github.sha }} .

  # Publishes the HTML docs to GitHub Pages on every push to main
  # (enable Pages with "GitHub Actions" as the source in the repository settings).
  publish-docs:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
