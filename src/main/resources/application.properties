# =====================================================================
# Common configuration. Profiles: default (H2 + sample data), prod (MySQL + Flyway)
# =====================================================================
spring.application.name=telecom-docs-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

# ---------- DataSource (H2 for local runs and tests) ----------
spring.datasource.url=jdbc:h2:mem:telecomdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JSON: also shapes the documented examples ----------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Paging (documented in overview.adoc) ----------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ---------- Demo users (override via env in real environments) ----------
telecom.security.agent-password=${AGENT_PASSWORD:agent-pass}
telecom.security.admin-password=${ADMIN_PASSWORD:admin-pass}

# ---------- Optional "openapi" profile: Swagger UI shows the spec generated from REST Docs tests ----------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.url=/docs/openapi3.yaml
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
